<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>Work Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@500;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="app">
  <div class="scan"></div>
  <div class="flash"></div>
  <div class="hdr">
    <span id="logo">SHIFT//LOG</span>
    <button id="sync" type="button">⚠ set up sheet</button>
  </div>
  <div id="overdue" class="overdue" hidden></div>
  <div id="status" class="status">Standby</div>
  <div id="time" class="time">0:00:00</div>
  <div id="today" class="today">TODAY ▸ 0h 0m</div>
  <div class="chips" id="chips">
    <button type="button" class="chip" data-cat="Client">Client</button>
    <button type="button" class="chip" data-cat="Personal">Personal</button>
    <button type="button" class="chip" data-cat="Employer">Employer</button>
  </div>
  <button id="btn" class="btn" type="button">START</button>
</main>

<section id="settings" class="sheet" hidden>
  <div class="sheet-card">
    <h2>SETTINGS</h2>
    <label class="field">Sheet sync URL
      <input id="sheetUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
    </label>
    <label class="toggle"><span>Sound</span><input id="sound" type="checkbox"></label>
    <label class="toggle"><span>Play sound in silent mode</span><input id="silentSound" type="checkbox"></label>
    <button id="closeSettings" class="save" type="button">Save</button>
  </div>
</section>

<label id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<script type="module" src="js/app.js"></script>
</body>
</html>
